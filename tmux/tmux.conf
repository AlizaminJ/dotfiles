# Generated by tmux.app Config Generator
# https://tmux.app/#config-generator

# ── Prefix Key ──────────────────────────
# Default prefix: Ctrl+b (no change needed)

# ── General Settings ─────────────────────
set -g mouse on
set -g history-limit 10000
set -g base-index 0
setw -g pane-base-index 0

# With mouse on, tmux owns selection, so Cmd+C copies nothing. Send selections to the macOS clipboard.
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"

# ── Status Bar ────────────────────────────
set -g status-position bottom
set -g status-interval 5
# Clickable session bar on a second status line (tmux 3.4+): click a name to switch project.
# Ranges inside status-left are ignored by tmux, so this lives in status-format.
# Each label is the folder the session's active pane is in, so it never goes stale.
set -g status 2
set -g status-format[1] "#{S:#[range=session|#{session_id}]#{?session_attached,#[reverse] #{b:pane_current_path} #[noreverse], #{b:pane_current_path} }#[norange]}"
bind -n M-s choose-tree -Zs
set -g status-left " #{b:pane_current_path} "
set -g status-right " %H:%M %d-%b "

# ── Terminal Colors ──────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ── Copilot agent flags (set by ~/.copilot/hooks/tmux-notify.sh) ──
setw -g window-status-format         "#I:#W#{?#{==:#{@agent_state},done}, #[fg=green]✓#[default],}#{?#{==:#{@agent_state},waiting}, #[fg=yellow]⚠#[default],}"
setw -g window-status-current-format "#I:#W*"
set -g display-time 5000
# prefix + A: list windows where an agent is done/waiting
bind A choose-tree -Zw -f '#{!=:#{@agent_state},}'

# Keep new panes and windows in the directory where you are working.
bind '"' split-window -v -c '#{pane_current_path}'
bind '%' split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

